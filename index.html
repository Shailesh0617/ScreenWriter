<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenWriter</title>
<style>
:root{--bg:#e9ecef;--panel:#fff;--ink:#1c2530;--muted:#6b7683;--line:#cfd6dd;--accent:#1f6f8b;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161b21;--panel:#1f262e;--ink:#e6ebf0;--muted:#8d99a6;--line:#35404c;--accent:#4fb0cf;--accent-ink:#0d1a21}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font:600 18px Georgia,serif;margin:0 8px 0 0;letter-spacing:.2px}
button,select,input[type=text]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:none}
.tabs button{border-radius:6px 6px 0 0}
main{flex:1;display:flex;min-height:0;gap:10px;padding:10px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0}
#notes{flex:1}#paint{flex:1.4}
.bar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:4px}
.spacer{flex:1}
textarea{flex:1;border:0;resize:none;padding:14px;font:16px/1.6 Georgia,serif;background:transparent;color:var(--ink);outline-offset:-2px}
.status{padding:4px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.canvas-wrap{flex:1;min-height:0;overflow:auto;background:repeating-conic-gradient(var(--bg) 0 25%,transparent 0 50%) 0 0/16px 16px}
canvas{display:block;background:#fff;touch-action:none;cursor:crosshair}
input[type=color]{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);padding:0}
@media (max-width:760px){
 .tabs{display:flex;gap:4px}
 main{flex-direction:column;padding:6px}
 section.hide{display:none}
}
</style>
</head>
<body>
<header>
 <h1>ScreenWriter</h1>
 <div class="tabs" role="tablist">
  <button id="tabN" class="on">Notes</button><button id="tabP">Paint</button>
 </div>
 <span class="spacer"></span>
 <button id="saveBoth" title="Download notes and drawing">Save both</button>
</header>
<main>
<section id="notes">
 <div class="bar">
  <button id="nNew">New</button>
  <button id="nOpen">Open</button>
  <button id="nSave">Save .txt</button>
  <button id="nCopy">Copy</button>
  <label>Size <select id="nSize"><option>14</option><option selected>16</option><option>18</option><option>22</option></select></label>
  <label><input type="checkbox" id="nWrap" checked> Wrap</label>
  <input type="file" id="nFile" accept=".txt,.md,text/*" hidden>
 </div>
 <textarea id="text" placeholder="Start writing. Your notes are saved in this browser automatically." spellcheck="true"></textarea>
 <div class="status" id="nStat">0 words · 0 characters</div>
</section>
<section id="paint">
 <div class="bar">
  <button data-tool="pen" class="on">Pen</button>
  <button data-tool="eraser">Eraser</button>
  <button data-tool="line">Line</button>
  <button data-tool="rect">Rectangle</button>
  <button data-tool="ellipse">Ellipse</button>
  <button data-tool="fill">Fill</button>
  <input type="color" id="color" value="#1f6f8b" aria-label="Color">
  <label>Width <input type="range" id="width" min="1" max="40" value="4"></label>
  <label><input type="checkbox" id="solid"> Filled</label>
  <span class="spacer"></span>
  <button id="undo">Undo</button>
  <button id="redo">Redo</button>
  <button id="clear">Clear</button>
  <button id="pSave">Save .png</button>
 </div>
 <div class="canvas-wrap" id="wrap"><canvas id="cv"></canvas></div>
 <div class="status" id="pStat">Draw with mouse, touch or pen.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Notes ---------- */
const ta=$('text');
ta.value=store.get('sw-text')||'';
function stat(){const t=ta.value.trim();$('nStat').textContent=(t?t.split(/\s+/).length:0)+' words · '+ta.value.length+' characters'}
ta.addEventListener('input',()=>{store.set('sw-text',ta.value);stat()});stat();
$('nNew').onclick=()=>{if(!ta.value||confirm('Clear the current notes?')){ta.value='';store.set('sw-text','');stat()}};
$('nOpen').onclick=()=>$('nFile').click();
$('nFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;store.set('sw-text',ta.value);stat()};r.readAsText(f);e.target.value=''};
function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function saveTxt(){const u=URL.createObjectURL(new Blob([ta.value],{type:'text/plain'}));dl(u,'notes.txt');setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('nSave').onclick=saveTxt;
$('nCopy').onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);$('nStat').textContent='Copied to clipboard'}catch(e){ta.select();document.execCommand('copy')}};
$('nSize').onchange=e=>ta.style.fontSize=e.target.value+'px';
ta.style.fontSize='16px';
$('nWrap').onchange=e=>ta.wrap=e.target.checked?'soft':'off';

/* ---------- Paint ---------- */
const cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),wrap=$('wrap');
let tool='pen',drawing=false,sx=0,sy=0,snap=null,undoS=[],redoS=[];
function blank(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
function size(){
 const w=Math.max(wrap.clientWidth,300),h=Math.max(wrap.clientHeight,300);
 if(cv.width===w&&cv.height===h)return;
 const old=cv.width?ctx.getImageData(0,0,cv.width,cv.height):null;
 cv.width=w;cv.height=h;blank();if(old)ctx.putImageData(old,0,0);
}
size();addEventListener('resize',size);
const saved=store.get('sw-img');
if(saved){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0);i.src=saved}
function persist(){try{store.set('sw-img',cv.toDataURL('image/png'))}catch(e){}}
function pushUndo(){undoS.push(ctx.getImageData(0,0,cv.width,cv.height));if(undoS.length>30)undoS.shift();redoS=[]}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function style(){ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=+$('width').value;ctx.strokeStyle=ctx.fillStyle=tool==='eraser'?'#fff':$('color').value}
cv.addEventListener('pointerdown',e=>{
 cv.setPointerCapture(e.pointerId);[sx,sy]=pos(e);
 if(tool==='fill'){pushUndo();floodFill(Math.floor(sx),Math.floor(sy),$('color').value);persist();return}
 pushUndo();drawing=true;snap=ctx.getImageData(0,0,cv.width,cv.height);style();
 if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.arc(sx,sy,ctx.lineWidth/2,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(sx,sy)}
});
cv.addEventListener('pointermove',e=>{
 const[x,y]=pos(e);$('pStat').textContent=Math.round(x)+', '+Math.round(y)+' px';
 if(!drawing)return;style();
 if(tool==='pen'||tool==='eraser'){ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);return}
 ctx.putImageData(snap,0,0);ctx.beginPath();
 if(tool==='line'){ctx.moveTo(sx,sy);ctx.lineTo(x,y)}
 else if(tool==='rect'){ctx.rect(sx,sy,x-sx,y-sy)}
 else if(tool==='ellipse'){ctx.ellipse((sx+x)/2,(sy+y)/2,Math.abs(x-sx)/2,Math.abs(y-sy)/2,0,0,7)}
 $('solid').checked?ctx.fill():ctx.stroke();
});
const end=()=>{if(drawing){drawing=false;persist()}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
function floodFill(x,y,hex){
 const w=cv.width,h=cv.height,img=ctx.getImageData(0,0,w,h),d=img.data;
 const t=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
 const i0=(y*w+x)*4,s=[d[i0],d[i0+1],d[i0+2]];
 if(s[0]===t[0]&&s[1]===t[1]&&s[2]===t[2])return;
 const match=i=>Math.abs(d[i]-s[0])+Math.abs(d[i+1]-s[1])+Math.abs(d[i+2]-s[2])<40;
 const st=[x,y];
 while(st.length){
  let cy=st.pop(),cx=st.pop();
  while(cy>=0&&match((cy*w+cx)*4))cy--;
  cy++;let L=false,R=false;
  while(cy<h&&match((cy*w+cx)*4)){
   const i=(cy*w+cx)*4;d[i]=t[0];d[i+1]=t[1];d[i+2]=t[2];d[i+3]=255;
   if(cx>0){const m=match(i-4);if(m&&!L){st.push(cx-1,cy);L=true}else if(!m)L=false}
   if(cx<w-1){const m=match(i+4);if(m&&!R){st.push(cx+1,cy);R=true}else if(!m)R=false}
   cy++;
  }
 }
 ctx.putImageData(img,0,0);
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
 tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));
 cv.style.cursor=tool==='fill'?'copy':'crosshair';
});
function undo(){if(!undoS.length)return;redoS.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(undoS.pop(),0,0);persist()}
function redo(){if(!redoS.length)return;undoS.push(ctx.getImageData(0,0,cv.width,cv.height));ctx.putImageData(redoS.pop(),0,0);persist()}
$('undo').onclick=undo;$('redo').onclick=redo;
$('clear').onclick=()=>{if(confirm('Clear the drawing?')){pushUndo();blank();persist()}};
function savePng(){dl(cv.toDataURL('image/png'),'drawing.png')}
$('pSave').onclick=savePng;
$('saveBoth').onclick=()=>{saveTxt();setTimeout(savePng,300)};
addEventListener('keydown',e=>{
 if(!(e.ctrlKey||e.metaKey))return;
 if(document.activeElement===ta)return;
 const k=e.key.toLowerCase();
 if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}
});

/* ---------- Mobile tabs ---------- */
function tab(p){$('notes').classList.toggle('hide',p);$('paint').classList.toggle('hide',!p);$('tabN').classList.toggle('on',!p);$('tabP').classList.toggle('on',p);setTimeout(size,0)}
$('tabN').onclick=()=>tab(false);$('tabP').onclick=()=>tab(true);
matchMedia('(max-width:760px)').matches?tab(false):0;
</script>
</body>
</html>
